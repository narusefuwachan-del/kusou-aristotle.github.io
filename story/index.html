<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Story | 空想世界アリストテレス</title>

  <link rel="icon" href="/favicon.png">
  <link rel="icon" href="/images/favicon.png" type="image/png">

  <style>
    @font-face{
      font-family:"Kazuki Reiwa";
      src:url("/fonts/KazukiReiwa-Light.ttf") format("truetype");
      font-weight:300;
      font-style:normal;
      font-display:swap;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
    }

    body,
    button{
      font-family:"Kazuki Reiwa","Shippori Mincho","Yu Mincho",serif;
    }

    body{
      line-height:1.85;
      color:#fff;
      background:#0b0b0f;
      overflow-x:hidden;
      animation:pageFade .45s ease both;
    }

    @keyframes pageFade{
      from{opacity:0}
      to{opacity:1}
    }

    /* ===== header ===== */

    .header{
      position:sticky;
      top:0;
      z-index:60;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .site-title{
      font-size:18px;
      letter-spacing:.08em;
      color:#fff;
      text-decoration:none;
    }

    .menu-btn{
      font-size:22px;
      background:none;
      border:none;
      cursor:pointer;
      color:#fff;
      padding:8px 10px;
      border-radius:10px;
    }

    .menu-btn:active{
      transform:scale(.98);
    }

    /* ===== 神殿案内図 ===== */

    .mapOverlay{
      position:fixed;
      inset:0;
      z-index:1000;
      background:rgba(0,0,0,.76);
      opacity:0;
      pointer-events:none;
      transition:opacity .35s ease;
      display:grid;
      place-items:center;
      padding:18px;
    }

    .mapOverlay.open{
      opacity:1;
      pointer-events:auto;
    }

    .mapPanel{
      position:relative;
      width:min(96vw,720px);
      aspect-ratio:1 / 1;
      opacity:0;
      transform:scale(.96);
      transition:
        opacity .42s ease,
        transform .42s ease;
      filter:drop-shadow(0 24px 80px rgba(0,0,0,.75));
    }

    .mapOverlay.open .mapPanel{
      opacity:1;
      transform:scale(1);
    }

    .mapBase,
    .mapSandou{
      position:absolute;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .mapBase{
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      z-index:1;
    }

    .mapSandou{
      left:50%;
      top:50%;
      width:30%;
      height:auto;
      transform:translate(-50%,-50%);
      z-index:4;
      opacity:.96;
      filter:drop-shadow(0 0 16px rgba(255,255,255,.22));
    }

    .mapCross{
      position:absolute;
      left:50%;
      top:50%;
      width:54%;
      height:54%;
      transform:translate(-50%,-50%);
      z-index:2;
      pointer-events:none;
    }

    .mapCross::before,
    .mapCross::after{
      content:"";
      position:absolute;
      background:rgba(255,255,255,.78);
      box-shadow:0 0 16px rgba(255,255,255,.55);
      border-radius:999px;
    }

    .mapCross::before{
      left:50%;
      top:0;
      width:2px;
      height:100%;
      transform:translateX(-50%);
    }

    .mapCross::after{
      left:0;
      top:50%;
      width:100%;
      height:2px;
      transform:translateY(-50%);
    }

    .mapCrossCenter{
      position:absolute;
      left:50%;
      top:50%;
      z-index:3;
      width:28px;
      height:28px;
      transform:translate(-50%,-50%) rotate(45deg);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:0 0 16px rgba(255,255,255,.45);
      pointer-events:none;
    }

    .mapTitleFrame{
      position:absolute;
      left:50%;
      top:4%;
      transform:translateX(-50%);
      z-index:20;
      min-width:48%;
      padding:6px 16px 7px;
      border:1px solid rgba(255,255,255,.42);
      background:rgba(0,0,0,.34);
      box-shadow:
        0 0 18px rgba(255,255,255,.12),
        inset 0 0 18px rgba(255,255,255,.06);
      text-align:center;
      pointer-events:none;
    }

    .mapTitle{
      font-size:clamp(16px,3.8vw,28px);
      letter-spacing:.18em;
      text-shadow:0 0 16px rgba(255,255,255,.35);
      white-space:nowrap;
    }

    .mapNote{
      position:absolute;
      left:0;
      right:0;
      bottom:5.5%;
      z-index:20;
      text-align:center;
      font-size:clamp(10px,2.5vw,14px);
      letter-spacing:.08em;
      opacity:.78;
      pointer-events:none;
      text-shadow:0 0 12px rgba(0,0,0,.9);
    }

    .mapClose{
      position:fixed;
      top:14px;
      right:16px;
      z-index:1010;
      width:42px;
      height:42px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(0,0,0,.45);
      color:#fff;
      font-size:20px;
      cursor:pointer;
    }

    .placeLabel{
      position:absolute;
      z-index:22;
      min-width:90px;
      padding:6px 10px 7px;
      border:1px solid rgba(255,255,255,.38);
      background:rgba(0,0,0,.42);
      box-shadow:
        0 0 14px rgba(255,255,255,.10),
        inset 0 0 12px rgba(255,255,255,.05);
      text-align:center;
      pointer-events:none;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    .placeLabel .en{
      display:block;
      font-size:11px;
      letter-spacing:.18em;
      opacity:.68;
      line-height:1.15;
    }

    .placeLabel .jp{
      display:block;
      margin-top:2px;
      font-size:15px;
      letter-spacing:.16em;
      line-height:1.2;
    }

    .label-story{
      left:50%;
      top:31%;
      transform:translate(-50%,-50%);
    }

    .label-character{
      left:22%;
      top:64%;
      transform:translate(-50%,-50%);
    }

    .label-guide{
      left:78%;
      top:64%;
      transform:translate(-50%,-50%);
    }

    .label-home{
      left:50%;
      top:84%;
      transform:translate(-50%,-50%);
    }

    .mapLink{
      position:absolute;
      z-index:30;
      display:block;
      border-radius:999px;
      -webkit-tap-highlight-color:transparent;
    }

    .mapLink::after{
      content:"";
      position:absolute;
      inset:10%;
      border-radius:999px;
      opacity:0;
      box-shadow:0 0 30px rgba(255,255,255,.9);
      transition:
        opacity .18s ease,
        transform .18s ease;
      transform:scale(.9);
    }

    .mapLink:hover::after,
    .mapLink:active::after{
      opacity:1;
      transform:scale(1);
    }

    .mapLink.current::before{
      content:"";
      position:absolute;
      width:18px;
      height:18px;
      border-radius:999px;
      background:#d51d2a;
      box-shadow:0 0 18px rgba(255,0,0,.95);
      left:50%;
      top:72%;
      transform:translate(-50%,-50%);
      z-index:3;
    }

    .mapLink.home{
      left:39%;
      top:63%;
      width:22%;
      height:22%;
    }

    .mapLink.character{
      left:7%;
      top:37%;
      width:24%;
      height:28%;
    }

    .mapLink.story{
      left:38%;
      top:13%;
      width:24%;
      height:24%;
    }

    .mapLink.guide{
      right:7%;
      top:37%;
      width:24%;
      height:26%;
    }

    .mapLink.loading::after{
      opacity:1;
      transform:scale(1.12);
      box-shadow:0 0 42px rgba(255,255,255,.95);
    }

    /* ===== glitch ===== */

    body.glitching::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:999;
      pointer-events:none;
      background:
        linear-gradient(
          90deg,
          rgba(255,0,80,.22),
          transparent 32%,
          rgba(0,255,255,.18)
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.20) 0px,
          rgba(255,255,255,.20) 1px,
          transparent 2px,
          transparent 6px
        );
      mix-blend-mode:screen;
      animation:realGlitch .38s steps(2,end) 1;
    }

    body.glitching::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:1000;
      pointer-events:none;
      background:rgba(0,0,0,.28);
      animation:glitchDark .38s steps(2,end) 1;
    }

    @keyframes realGlitch{
      0%{
        opacity:0;
        transform:translate(0,0);
      }

      18%{
        opacity:.95;
        transform:translate(-6px,2px);
      }

      34%{
        opacity:.45;
        transform:translate(7px,-2px);
      }

      52%{
        opacity:.85;
        transform:translate(-3px,-4px);
      }

      72%{
        opacity:.55;
        transform:translate(4px,3px);
      }

      100%{
        opacity:0;
        transform:translate(0,0);
      }
    }

    @keyframes glitchDark{
      0%{opacity:0}
      30%{opacity:.7}
      60%{opacity:.3}
      100%{opacity:0}
    }

    /* ===== page wrapper ===== */

    .box{
      max-width:980px;
      margin:0 auto;
      padding:22px 16px 56px;
      text-align:center;
    }

    .title-ruby{
      font-size:13px;
      letter-spacing:.35em;
      opacity:.55;
      margin-top:22px;
      margin-bottom:6px;
    }

    h1{
      margin:0 0 14px;
      font-size:42px;
      font-weight:300;
      letter-spacing:.16em;
      color:#fff;
    }

    /* ===== S1/S2 switch ===== */

    .switch{
      margin:22px auto 18px;
      display:flex;
      width:220px;
      border-radius:999px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.05);
    }

    .switch button{
      flex:1;
      border:none;
      padding:12px 0;
      font-size:16px;
      background:none;
      color:#fff;
      cursor:pointer;
      font-family:inherit;
      letter-spacing:.22em;
    }

    .switch button.active{
      background:#1aa5a5;
      color:#000;
    }

    /* ===== visual ===== */

    .visual{
      width:min(560px,92vw);
      margin:18px auto 16px;
      border:1px solid rgba(255,255,255,.20);
      background:rgba(255,255,255,.03);
      overflow:hidden;
      border-radius:14px;
    }

    .visual img{
      width:100%;
      display:block;
      height:auto;
    }

    /* ===== summary ===== */

    .summary{
      width:min(560px,92vw);
      margin:14px auto 18px;
      line-height:2;
      opacity:.88;
      letter-spacing:.04em;
      text-align:left;
      white-space:pre-wrap;
    }

    /* ===== buttons ===== */

    .readBtn,
    .backTopBtn{
      background:#1aa5a5;
      border:none;
      padding:14px 30px;
      color:#000;
      font-size:16px;
      cursor:pointer;
      margin:18px 0 0;
      border-radius:999px;
      letter-spacing:.18em;
      font-family:inherit;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
      -webkit-tap-highlight-color:transparent;
    }

    .backTopBtn{
      margin-top:22px;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .backTopBtn span{
      letter-spacing:0;
    }

    /* ===== chapter page ===== */

    .chapterPage{
      display:none;
      padding-top:18px;
    }

    .seasonTitle{
      margin-top:22px;
      font-size:34px;
      font-weight:300;
      letter-spacing:.14em;
    }

    .chapterList{
      width:min(620px,92vw);
      margin:18px auto 0;
      padding-bottom:20px;
    }

    .chapterRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      margin:12px 0;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.04);
      opacity:0;
      transform:translateX(-38px);
      animation:slideFade .62s ease forwards;
    }

    @keyframes slideFade{
      to{
        opacity:1;
        transform:translateX(0);
      }
    }

    .chapterLeft{
      display:flex;
      align-items:baseline;
      gap:12px;
      min-width:0;
      text-align:left;
    }

    .chapterNo{
      font-size:18px;
      letter-spacing:.12em;
      opacity:.78;
      flex:0 0 auto;
      white-space:nowrap;
    }

    .chapterName{
      font-size:20px;
      letter-spacing:.10em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .chapterRow button{
      flex:0 0 auto;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.16);
      color:#fff;
      font-size:14px;
      cursor:pointer;
      padding:10px 14px;
      border-radius:999px;
      letter-spacing:.12em;
      font-family:inherit;
      -webkit-tap-highlight-color:transparent;
    }

    .chapterRow button:hover{
      background:rgba(255,255,255,.10);
    }

    .chapterRow button:disabled{
      cursor:default;
      opacity:.38;
      background:transparent;
    }

    /* ===== novel ===== */

    .novelPage{
      display:none;
      width:min(700px,100%);
      margin:0 auto;
      padding:8px 0 40px;
      text-align:left;
      animation:novelFade .55s ease both;
    }

    @keyframes novelFade{
      from{
        opacity:0;
        transform:translateY(8px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .novelBreadcrumb{
      margin:10px 0 36px;
      font-size:11px;
      letter-spacing:.14em;
      color:rgba(255,255,255,.48);
    }

    .novelArchive{
      margin-bottom:12px;
      font-size:10px;
      letter-spacing:.34em;
      color:rgba(255,255,255,.44);
    }

    .novelChapter{
      margin:0;
      font-size:19px;
      font-weight:300;
      letter-spacing:.18em;
      color:rgba(255,255,255,.72);
    }

    .novelTitle{
      margin:9px 0 0;
      font-size:36px;
      font-weight:300;
      letter-spacing:.16em;
      line-height:1.45;
    }

    .novelDivider{
      position:relative;
      height:1px;
      margin:40px 0 42px;
      background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.28) 12%,
        rgba(255,255,255,.28) 88%,
        transparent
      );
    }

    .novelDivider::after{
      content:"✦";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      padding:0 12px;
      background:#0b0b0f;
      color:rgba(255,255,255,.62);
      font-size:12px;
    }

    /* ===== bookmark resume ===== */

    .bookmarkResume{
      display:none;
      margin:0 0 34px;
      padding:15px 16px;
      border:1px solid rgba(26,165,165,.38);
      border-radius:14px;
      background:rgba(26,165,165,.07);
    }

    .bookmarkResume.show{
      display:block;
    }

    .bookmarkResumeTitle{
      font-size:12px;
      letter-spacing:.14em;
      color:rgba(255,255,255,.68);
    }

    .bookmarkResumeInfo{
      margin-top:5px;
      font-size:14px;
      letter-spacing:.06em;
    }

    .bookmarkResumeActions{
      display:flex;
      gap:10px;
      margin-top:13px;
      flex-wrap:wrap;
    }

    .bookmarkResumeActions button{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;
      border-radius:999px;
      padding:9px 14px;
      font-family:inherit;
      cursor:pointer;
      font-size:12px;
      letter-spacing:.08em;
    }

    .bookmarkResumeActions .resumeBtn{
      background:#1aa5a5;
      color:#000;
      border-color:#1aa5a5;
    }

    /* ===== novel body ===== */

    .novelBody{
      font-size:16px;
      line-height:2.25;
      letter-spacing:.045em;
      color:rgba(255,255,255,.91);
      word-break:normal;
      overflow-wrap:anywhere;
    }

    .novelBody p{
      margin:0 0 2em;
      white-space:pre-wrap;
      scroll-margin-top:90px;
    }

    .novelBody p.bookmarkedParagraph{
      position:relative;
    }

    .novelBody p.bookmarkedParagraph::before{
      content:"";
      position:absolute;
      left:-14px;
      top:.45em;
      width:3px;
      height:1.2em;
      border-radius:999px;
      background:#1aa5a5;
      box-shadow:0 0 10px rgba(26,165,165,.7);
    }

    .novelLoading,
    .novelError{
      padding:50px 0;
      text-align:center;
      font-size:13px;
      letter-spacing:.12em;
      color:rgba(255,255,255,.55);
    }

    .novelBottomDivider{
      height:1px;
      margin:54px 0 24px;
      background:rgba(255,255,255,.14);
    }

    .novelNav{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
    }

    .novelNav button{
      min-height:48px;
      border:none;
      background:none;
      color:#fff;
      cursor:pointer;
      font-family:inherit;
      font-size:14px;
      letter-spacing:.12em;
      padding:10px 4px;
      -webkit-tap-highlight-color:transparent;
    }

    .novelNav button:first-child{
      text-align:left;
    }

    .novelNav button:last-child{
      text-align:right;
    }

    .novelNav button:disabled{
      opacity:.22;
      cursor:default;
    }

    .novelIndexBtn{
      position:relative;
    }

    .novelIndexBtn::after{
      content:"";
      position:absolute;
      left:16%;
      right:16%;
      bottom:5px;
      height:1px;
      background:rgba(26,165,165,.75);
    }

    /* ===== bookmark floating button ===== */

    .bookmarkBtn{
      position:fixed;
      right:18px;
      bottom:22px;
      z-index:70;
      display:none;
      align-items:center;
      gap:7px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(11,11,15,.88);
      color:#fff;
      border-radius:999px;
      padding:12px 17px;
      font-family:inherit;
      font-size:13px;
      letter-spacing:.08em;
      cursor:pointer;
      box-shadow:0 8px 30px rgba(0,0,0,.48);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      -webkit-tap-highlight-color:transparent;
    }

    .bookmarkBtn.show{
      display:flex;
    }

    .bookmarkBtn:active{
      transform:scale(.97);
    }

    /* ===== bookmark toast ===== */

    .bookmarkToast{
      position:fixed;
      left:50%;
      bottom:82px;
      z-index:80;
      max-width:calc(100vw - 36px);
      transform:translate(-50%,15px);
      padding:10px 16px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      background:rgba(0,0,0,.86);
      color:#fff;
      font-size:12px;
      letter-spacing:.08em;
      opacity:0;
      pointer-events:none;
      transition:
        opacity .2s ease,
        transform .2s ease;
      white-space:nowrap;
    }

    .bookmarkToast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    /* ===== footer ===== */

    .footer{
      position:relative;
      z-index:5;
      padding:44px 16px 56px;
      text-align:center;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border-top:1px solid rgba(255,255,255,.10);
      margin-top:30px;
    }

    .footer-inner{
      max-width:960px;
      margin:0 auto;
    }

    .footer-logo{
      width:min(64vw,260px);
      height:auto;
      display:block;
      margin:0 auto 18px;
      opacity:.92;
      filter:drop-shadow(0 8px 28px rgba(0,0,0,.45));
    }

    .footer-title{
      margin:0 0 10px;
      font-weight:800;
      letter-spacing:.08em;
      font-size:13px;
      color:rgba(255,255,255,.78);
    }

    .share{
      margin:10px 0 18px;
      display:grid;
      gap:10px;
      justify-items:center;
    }

    .share-row,
    .footer-sns{
      display:flex;
      justify-content:center;
      gap:16px;
      flex-wrap:wrap;
    }

    .footer-sns{
      margin:12px 0 6px;
    }

    .sns-btn{
      width:44px;
      height:44px;
      border-radius:999px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;
      text-decoration:none;
      transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;
    }

    .sns-btn:active{
      transform:scale(.98);
    }

    .sns-btn:hover{
      background:rgba(255,255,255,.10);
      border-color:rgba(255,255,255,.28);
    }

    .icon-img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:block;
      opacity:.92;
    }

    .footer-note{
      margin-top:18px;
      font-size:12px;
      color:rgba(255,255,255,.60);
      letter-spacing:.03em;
      line-height:1.7;
    }

    /* ===== smartphone ===== */

    @media(max-width:520px){

      .header{
        padding:10px 14px;

    function openMap(){

        "glitching"
      );


      setTimeout(() => {

        document.body.classList.remove(
          "glitching"
        );

        mapOverlay.classList.add(
          "open"
        );

        mapOverlay.setAttribute(
          "aria-hidden",
          "false"
        );

        document.body.style.overflow =
          "hidden";

      },420);

    }


    function closeMap(){

      mapOverlay.classList.remove(
        "open"
      );

      mapOverlay.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow =
        "";

    }


    menuBtn.addEventListener(
      "click",
      openMap
    );


    mapClose.addEventListener(
      "click",
      closeMap
    );


    mapOverlay.addEventListener(
      "click",
      (event) => {

        if(event.target === mapOverlay){
          closeMap();
        }

      }
    );


    window.addEventListener(
      "keydown",
      (event) => {

        if(
          event.key === "Escape" &&
          mapOverlay.classList.contains("open")

          closeMap();
        }

      }

    /* ==========================================
       BOOKMARK
    ========================================== */

    function getBookmarkKey(chapter){

      return `aristotle-bookmark-${chapter.id}`;

    }


    function getBookmark(chapter){

      if(!chapter){
        return null;
      }


      try{

        const raw =
          localStorage.getItem(
            getBookmarkKey(chapter)
          );


        if(!raw){
          return null;
        }


        return JSON.parse(raw);

      }catch(error){

        return null;

      }

    }


    function showBookmarkToast(message){

      bookmarkToast.textContent =
        message;

      bookmarkToast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(() => {

          bookmarkToast.classList.remove(
            "show"
          );

        },1800);

    }


    function getCurrentParagraphIndex(){

      const paragraphs =
        [...novelBody.querySelectorAll("p")];


      if(!paragraphs.length){
        return 0;
      }


      const targetY =
        window.innerHeight * .42;


      let closestIndex =
        0;

      let closestDistance =
        Infinity;


      paragraphs.forEach(
        (paragraph,index) => {

          const rect =
            paragraph.getBoundingClientRect();

          const center =
            rect.top + rect.height / 2;

          const distance =
            Math.abs(
              center - targetY
            );


          if(distance < closestDistance){

            closestDistance =
              distance;

            closestIndex =
              index;

          }

        }
      );


      return closestIndex;

    }


    function calculateProgress(
      paragraphIndex
    ){

      const paragraphs =
        novelBody.querySelectorAll("p");


      if(!paragraphs.length){
        return 0;
      }


      if(paragraphs.length === 1){
        return 100;
      }


      return Math.round(
        (
          paragraphIndex /
          (paragraphs.length - 1)
        ) * 100
      );

    }


    function highlightBookmark(
      paragraphIndex
    ){

      novelBody
        .querySelectorAll(
          ".bookmarkedParagraph"
        )
        .forEach(element => {

          element.classList.remove(
            "bookmarkedParagraph"
          );

        });


      const paragraphs =
        novelBody.querySelectorAll("p");


      const paragraph =
        paragraphs[paragraphIndex];


      if(paragraph){

        paragraph.classList.add(
          "bookmarkedParagraph"
        );

      }

    }


    function saveBookmark(){

      if(
        currentNovelIndex === null
      ){
        return;
      }


      const chapter =
        chapters[season][currentNovelIndex];


      if(!chapter){
        return;
      }


      const paragraphIndex =
        getCurrentParagraphIndex();


      const progress =
        calculateProgress(
          paragraphIndex
        );


      const data = {

        chapterId:
          chapter.id,

        paragraphIndex,

        progress,

        savedAt:
          Date.now()

      };


      try{

        localStorage.setItem(
          getBookmarkKey(chapter),
          JSON.stringify(data)
        );


        highlightBookmark(
          paragraphIndex
        );


        updateBookmarkResume();


        showBookmarkToast(
          `しおりを挟みました　${progress}%`
        );

      }catch(error){

        showBookmarkToast(
          "しおりを保存できませんでした"
        );

      }

    }


    function deleteBookmark(){

      if(
        currentNovelIndex === null
      ){
        return;
      }


      const chapter =
        chapters[season][currentNovelIndex];


      if(!chapter){
        return;
      }


      localStorage.removeItem(
        getBookmarkKey(chapter)
      );


      novelBody
        .querySelectorAll(
          ".bookmarkedParagraph"
        )
        .forEach(element => {

          element.classList.remove(
            "bookmarkedParagraph"
          );

        });


      updateBookmarkResume();


      showBookmarkToast(
        "しおりを削除しました"
      );

    }


    function jumpToBookmark(){

      if(
        currentNovelIndex === null
      ){
        return;
      }


      const chapter =
        chapters[season][currentNovelIndex];

      const bookmark =
        getBookmark(chapter);


      if(!bookmark){
        return;
      }


      const paragraphs =
        novelBody.querySelectorAll("p");


      const target =
        paragraphs[
          bookmark.paragraphIndex
        ];


      if(!target){
        return;
      }


      highlightBookmark(
        bookmark.paragraphIndex
      );


      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }


    function updateBookmarkResume(){

      if(
        currentNovelIndex === null
      ){

        bookmarkResume.classList.remove(
          "show"
        );

        return;

      }


      const chapter =
        chapters[season][currentNovelIndex];

      const bookmark =
        getBookmark(chapter);


      if(!bookmark){

        bookmarkResume.classList.remove(
          "show"
        );

        return;

      }


      bookmarkResumeInfo.textContent =
        `前回の位置：${bookmark.progress ?? 0}%`;


      bookmarkResume.classList.add(
        "show"
      );


      highlightBookmark(
        bookmark.paragraphIndex
      );

    }


    bookmarkBtn.addEventListener(
      "click",
      saveBookmark
    );


    resumeBookmarkBtn.addEventListener(
      "click",
      jumpToBookmark
    );


    deleteBookmarkBtn.addEventListener(
      "click",
      deleteBookmark
    );


    /* ==========================================
       Story top
    ========================================== */

    function updateMain(){

      summaryEl.textContent =
        summaries[season];

      storyImg.src =
        `/images/story/${season}.webp`;

      storyImg.alt =
        `Story ${season.toUpperCase()}`;

    }


    function setSeason(nextSeason){

      season =
        nextSeason;


      s1Btn.classList.toggle(
        "active",
        season === "s1"
      );


      s2Btn.classList.toggle(
        "active",
        season === "s2"
      );


      updateMain();

    }


    s1Btn.addEventListener(
      "click",
      () => {

        setSeason("s1");

      }
    );


    s2Btn.addEventListener(
      "click",
      () => {

        setSeason("s2");

      }
    );


    /* ==========================================
       Chapter list
    ========================================== */

    function openChapters(){

      storyTop.style.display =
        "none";

      novelPage.style.display =
        "none";

      chaptersSec.style.display =
        "block";


      chaptersSec.setAttribute(
        "aria-hidden",
        "false"
      );


      novelPage.setAttribute(
        "aria-hidden",
        "true"
      );


      mainBox.classList.remove(
        "novelMode"
      );


      bookmarkBtn.classList.remove(
        "show"
      );


      renderChapters();


      window.scrollTo({
        top:0,
        behavior:"instant"
      });

    }


    function renderChapters(){

      seasonTitle.textContent =
        season === "s1"
          ? "1 期"
          : "2 期";


      chapterList.innerHTML =
        "";


      chapters[season].forEach(
        (chapter,index) => {

          const row =
            document.createElement("div");


          row.className =
            "chapterRow";


          row.style.animationDelay =
            `${0.08 + index * 0.08}s`;


          const hasBookmark =
            Boolean(
              getBookmark(chapter)
            );


          let buttonText =
            "準備中";


          if(chapter.published){

            buttonText =
              hasBookmark
                ? "続きから"
                : "読む";

          }


          row.innerHTML = `
            <div class="chapterLeft">

              <div class="chapterNo">
                ${chapter.no}
              </div>

              <div class="chapterName">
                ${chapter.title}
              </div>

            </div>

            <button
              type="button"
              data-idx="${index}"
              data-resume="${hasBookmark ? "true" : "false"}"
              ${chapter.published ? "" : "disabled"}
            >
              ${buttonText}
            </button>
          `;


          chapterList.appendChild(
            row
          );

        }
      );

    }


    function backToTop(){

      chaptersSec.style.display =
        "none";

      novelPage.style.display =
        "none";

      storyTop.style.display =
        "";


      chaptersSec.setAttribute(
        "aria-hidden",
        "true"
      );


      novelPage.setAttribute(
        "aria-hidden",
        "true"
      );


      mainBox.classList.remove(
        "novelMode"
      );


      bookmarkBtn.classList.remove(
        "show"
      );


      updateMain();


      window.scrollTo({
        top:0,
        behavior:"instant"
      });

    }


    readBtn.addEventListener(
      "click",
      openChapters
    );


    backTopBtn.addEventListener(
      "click",
      backToTop
    );


    /* ==========================================
       TXT → 本文表示
    ========================================== */

    function renderNovelText(text){

      novelBody.innerHTML =
        "";


      const normalized =
        text.replace(
          /\r\n/g,
          "\n"
        );


      const paragraphs =
        normalized
          .split(/\n\s*\n/)
          .map(
            text =>
              text.trim()
          )
          .filter(Boolean);


      paragraphs.forEach(
        (text,index) => {

          const p =
            document.createElement("p");


          p.textContent =
            text;


          p.dataset.paragraph =
            index;


          novelBody.appendChild(
            p
          );

        }
      );

    }


    /* ==========================================
       Open novel
    ========================================== */

    async function openNovel(
      index,
      resumeAfterLoad = false
    ){

      const chapter =
        chapters[season][index];


      if(
        !chapter ||
        !chapter.published ||
        !chapter.file
      ){
        return;
      }


      currentNovelIndex =
        index;


      storyTop.style.display =
        "none";

      chaptersSec.style.display =
        "none";

      novelPage.style.display =
        "block";


      chaptersSec.setAttribute(
        "aria-hidden",
        "true"
      );


      novelPage.setAttribute(
        "aria-hidden",
        "false"
      );


      mainBox.classList.add(
        "novelMode"
      );


      bookmarkBtn.classList.add(
        "show"
      );


      novelBreadcrumb.textContent =
        `STORY ＞ ${season.toUpperCase()} ＞ ${chapter.no} ${chapter.title}`;


      novelArchive.textContent =
        `ARCHIVE ${String(index + 1).padStart(2,"0")} / STORY RECORD`;


      novelChapter.textContent =
        `${chapter.no}　${chapter.title}`;


      novelTitle.textContent =
        chapter.title;


      bookmarkResume.classList.remove(
        "show"
      );


      novelBody.innerHTML = `
        <div class="novelLoading">
          読み込み中…
        </div>
      `;


      updateNovelNavigation();


      window.scrollTo({
        top:0,
        behavior:"instant"
      });


      try{

        const response =
          await fetch(
            chapter.file
          );


        if(!response.ok){

          throw new Error(
            "本文を読み込めませんでした"
          );

        }


        const text =
          await response.text();


        renderNovelText(
          text
        );


        updateBookmarkResume();


        if(resumeAfterLoad){

          requestAnimationFrame(() => {

            requestAnimationFrame(() => {

              jumpToBookmark();

            });

          });

        }

      }catch(error){

        console.error(
          error
        );


        bookmarkBtn.classList.remove(
          "show"
        );


        novelBody.innerHTML = `
          <div class="novelError">
            本文を読み込めませんでした。
          </div>
        `;

      }

    }


    /* ==========================================
       Novel navigation
    ========================================== */

    function getPublishedIndex(
      startIndex,
      direction
    ){

      let index =
        startIndex + direction;


      while(
        index >= 0 &&
        index < chapters[season].length
      ){

        if(
          chapters[season][index].published
        ){
          return index;
        }


        index +=
          direction;

      }


      return null;

    }


    function updateNovelNavigation(){

      const prevIndex =
        getPublishedIndex(
          currentNovelIndex,
          -1
        );


      const nextIndex =
        getPublishedIndex(
          currentNovelIndex,
          1
        );


      prevNovelBtn.disabled =
        prevIndex === null;


      nextNovelBtn.disabled =
        nextIndex === null;


      prevNovelBtn.dataset.index =
        prevIndex ?? "";


      nextNovelBtn.dataset.index =
        nextIndex ?? "";

    }


    prevNovelBtn.addEventListener(
      "click",
      () => {

        if(
          prevNovelBtn.disabled
        ){
          return;
        }


        openNovel(
          Number(
            prevNovelBtn.dataset.index
          )
        );

      }
    );


    nextNovelBtn.addEventListener(
      "click",
      () => {

        if(
          nextNovelBtn.disabled
        ){
          return;
        }


        openNovel(
          Number(
            nextNovelBtn.dataset.index
          )
        );

      }
    );


    novelIndexBtn.addEventListener(
      "click",
      openChapters
    );


    /* ==========================================
       Chapter button
    ========================================== */

    chapterList.addEventListener(
      "click",
      (event) => {

        const button =
          event.target.closest(
            "button"
          );


        if(
          !button ||
          button.disabled
        ){
          return;
        }


        const index =
          Number(
            button.dataset.idx
          );


        const resume =
          button.dataset.resume ===
          "true";


        openNovel(
          index,
          resume
        );

      }
    );


    /* ==========================================
       Initial
    ========================================== */

    updateMain();

  </script>

</body>
</html>
